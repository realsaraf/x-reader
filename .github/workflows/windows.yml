name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check the Rust source and library storage
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test the frontend
        run: npm test
      - name: Exercise the reader in Microsoft Edge
        run: npm run test:e2e
      - name: Build the desktop application and installer
        run: npm run tauri -- build --bundles nsis
      - name: Package Windows downloads and checksums
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: x-reader-windows-x64
          path: release/
          retention-days: 14
          if-no-files-found: error
