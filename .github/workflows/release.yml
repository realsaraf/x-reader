name: Release x-reader

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish the finished release immediately
        default: true

concurrency:
  group: x-reader-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: x-reader-*
          merge-multiple: true
          path: release
      - name: Attach verified downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          sha256sum -c SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt >> SHA256SUMS.txt
          cd ..
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          # Refuse a version tag already attached to a different revision.
          if [[ -n "$(git ls-remote origin "refs/tags/$tag")" ]]; then
            git fetch --depth=1 origin "refs/tags/$tag"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$GITHUB_SHA" ]] || {
              echo "::error::Tag $tag points to a different commit."; exit 1;
            }
          fi

          if state=$(gh release view "$tag" --json isDraft,targetCommitish); then
            [[ "$(jq -r .isDraft <<< "$state")" == true ]] || {
              echo "::error::Release $tag is already public. Choose a new version."; exit 1;
            }
            [[ "$(jq -r .targetCommitish <<< "$state")" == "$GITHUB_SHA" ]] || {
              echo "::error::The existing draft targets another revision."; exit 1;
            }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --generate-notes --notes-file docs/release-downloads.md --title "x-reader $version"
          fi
          gh release upload "$tag" --clobber release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt
          if [[ "$PUBLISH" == true ]]; then gh release edit "$tag" --draft=false; fi
